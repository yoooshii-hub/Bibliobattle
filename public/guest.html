<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f1e6">
<title>ビブリオバトル投票</title>
<link rel="stylesheet" href="/style.css">
<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; min-height: 100dvh; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  header { padding: 14px 16px 6px; text-align: center; padding-top: max(14px, env(safe-area-inset-top)); }
  header h1 { font-size: 17px; word-break: break-all; }
  .status { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 800; margin-top: 4px; padding: 2px 12px; border-radius: 99px; background: #eee3d3; color: var(--muted); }
  .status.open { background: #dff3e6; color: var(--ok); }
  .status.open::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: blink 1.2s infinite; }
  .sound { position: absolute; top: max(10px, env(safe-area-inset-top)); right: 10px; border: 0; background: transparent; font-size: 22px; padding: 6px; }

  .buttons { flex: 1; display: grid; grid-template-rows: 1.35fr 1fr 1fr; gap: 12px; padding: 8px 16px max(16px, env(safe-area-inset-bottom)); }
  @media (min-width: 820px) and (min-aspect-ratio: 1/1) {
    .buttons { grid-template-rows: none; grid-template-columns: 1.3fr 1fr 1fr; max-width: 1200px; width: 100%; margin: 0 auto; padding: 24px; gap: 20px; }
    .vote { flex-direction: column !important; text-align: center; }
    .vote .ic { width: 55% !important; height: auto !important; max-width: 240px; }
    .vote .txt { align-items: center !important; }
  }
  .vote {
    position: relative; overflow: hidden; border: 3px solid var(--ink); border-radius: 22px;
    background: var(--soft); color: var(--ink); display: flex; align-items: center; gap: 14px; padding: 12px 18px;
    box-shadow: 0 6px 0 var(--ink); touch-action: manipulation; cursor: pointer;
    transition: transform .06s, box-shadow .06s, filter .2s, opacity .2s; font: inherit; text-align: left; min-height: 0;
  }
  .vote:hover { background: var(--soft); }
  .vote.press { transform: translateY(5px) scale(.985); box-shadow: 0 1px 0 var(--ink); }
  .vote:disabled { filter: grayscale(.9); opacity: .5; transform: none; box-shadow: 0 6px 0 var(--ink); }
  .vote .ic { width: 30%; max-width: 150px; height: 88%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; position: relative; z-index: 1; }
  .vote .ic svg { width: 100%; height: 100%; max-height: 150px; }
  .vote.v0 .ic svg { max-height: 190px; }
  .vote .txt { flex: 1; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; position: relative; z-index: 1; min-width: 0; }
  .vote .lb { font-size: clamp(16px, 4.8vw, 26px); font-weight: 900; line-height: 1.25; }
  .vote.v0 .lb { font-size: clamp(22px, 6.6vw, 34px); }
  .vote .mine { font-size: 13px; font-weight: 800; background: rgba(255,255,255,.75); border-radius: 99px; padding: 3px 12px; display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
  .vote .mine .dot { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid currentColor; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; line-height: 1; }
  /* 選択中のボタン */
  .vote.selected { outline: 5px solid var(--col); outline-offset: 3px; }
  .vote.selected .mine { background: var(--col); color: #fff; }
  .vote.selected .mine .dot { background: #fff; border-color: #fff; color: var(--col); }
  .vote.selected .mine.pop { animation: pop .35s ease-out; }
  .buttons.has-choice .vote:not(.selected):not(:disabled) { filter: saturate(.55); opacity: .72; }
  @keyframes pop { 40% { transform: scale(1.15); } }
  .hint { font-size: 13px; color: var(--muted); font-weight: 700; margin-top: 4px; min-height: 1.4em; }

  .ripple { position: absolute; border-radius: 50%; background: var(--col); opacity: .35; transform: scale(0); animation: ripple .55s ease-out forwards; pointer-events: none; }
  @keyframes ripple { to { transform: scale(1); opacity: 0; } }
  .float { position: absolute; font-weight: 900; font-size: 30px; color: var(--col); pointer-events: none; z-index: 3; text-shadow: 0 2px 0 #fff, 0 -2px 0 #fff, 2px 0 0 #fff, -2px 0 0 #fff; animation: floatUp .8s ease-out forwards; }
  @keyframes floatUp { from { transform: translate(-50%, -50%) scale(.6); opacity: 1; } 30% { transform: translate(-50%, -110%) scale(1.15); } to { transform: translate(-50%, -260%) scale(1); opacity: 0; } }
  .particle { position: absolute; width: 12px; height: 12px; border-radius: 3px; pointer-events: none; z-index: 2; animation: burst .6s ease-out forwards; }
  @keyframes burst { to { transform: translate(var(--dx), var(--dy)) rotate(var(--r)); opacity: 0; } }
  .vote.v0.press .spark { animation: twinkle .4s; transform-origin: center; transform-box: fill-box; }
  @keyframes twinkle { 50% { transform: scale(1.6) rotate(20deg); } }

  .overlay {
    position: fixed; inset: 0; background: rgba(247, 241, 230, .55); backdrop-filter: blur(2px);
    display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 20; pointer-events: none; opacity: 0; transition: opacity .25s;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .overlay .msg { background: var(--paper); border: 3px solid var(--ink); border-radius: 20px; padding: 22px 24px; text-align: center; max-width: 380px; box-shadow: 0 6px 0 var(--ink); }
  .overlay .msg .big { font-size: 20px; font-weight: 900; margin-bottom: 6px; }
  .overlay .msg .books { display: flex; justify-content: center; gap: 4px; margin-bottom: 8px; }
  .overlay .msg .books span { width: 40px; height: 40px; animation: bob 1.4s ease-in-out infinite; }
  .overlay .msg .books span:nth-child(2) { animation-delay: .2s; }
  .overlay .msg .books span:nth-child(3) { animation-delay: .4s; }
  @keyframes bob { 50% { transform: translateY(-6px); } }

  .reset-flash { position: fixed; left: 50%; top: 22%; transform: translate(-50%, -50%); background: var(--ink); color: #fff; font-weight: 900; padding: 14px 22px; border-radius: 14px; z-index: 30; animation: flash 1.6s ease-out forwards; pointer-events: none; text-align: center; }
  @keyframes flash { 0% { opacity: 0; transform: translate(-50%, -40%); } 15%, 75% { opacity: 1; transform: translate(-50%, -50%); } 100% { opacity: 0; } }
</style>
</head>
<body>
<header>
  <h1 id="evName">読み込み中…</h1>
  <div class="status" id="statusEl"></div>
  <div class="hint" id="hint"></div>
  <button class="sound" id="soundBtn" aria-label="効果音のオン/オフ">🔊</button>
</header>
<main class="buttons" id="buttons"></main>
<div class="overlay" id="overlay"><div class="msg"><div class="books" id="books"></div><div class="big" id="ovBig"></div><div class="muted small" id="ovSmall"></div></div></div>

<script src="/socket.io/socket.io.js"></script>
<script src="/common.js"></script>
<script>
  const slug = location.pathname.split('/').pop();
  let state = null;
  let sessionId = null;
  let mine = null; // このセッションで選んでいるボタン（0〜2）。未選択は null
  // 端末ごとの投票ID（1端末1票。ブラウザに残っていれば同じ票として扱う）
  let voterId = null;
  try { voterId = localStorage.getItem('bv:voter'); } catch (e) {}
  if (!voterId || !/^[A-Za-z0-9_-]{8,40}$/.test(voterId)) {
    voterId = Array.from(crypto.getRandomValues(new Uint8Array(16)), (b) => 'abcdefghijkmnpqrstuvwxyz23456789'[b % 32]).join('');
    try { localStorage.setItem('bv:voter', voterId); } catch (e) {}
  }
  let soundOn = true;
  try { soundOn = localStorage.getItem('bv:sound') !== 'off'; } catch (e) {}
  soundBtn.textContent = soundOn ? '🔊' : '🔈';
  books.innerHTML = BV_ICONS.map((s) => `<span>${s}</span>`).join('');

  // ---------- ボタン ----------
  buttons.innerHTML = BV_CHOICES.map((ch, i) => `
    <button class="vote v${i}" data-i="${i}" style="--soft:${ch.soft};--col:${ch.color}" disabled>
      <span class="ic">${BV_ICONS[i]}</span>
      <span class="txt"><span class="lb">${ch.label.replace('・・', '・・<br>')}</span><span class="mine" id="m${i}"><span class="dot"></span><span class="t">タップで選ぶ</span></span></span>
    </button>`).join('');
  const btnEls = [...buttons.querySelectorAll('.vote')];

  // ---------- 自分の選択 ----------
  function showMine(pop = false) {
    btnEls.forEach((b, i) => {
      const on = mine === i;
      b.classList.toggle('selected', on);
      b.setAttribute('aria-pressed', String(on));
      const m = document.getElementById('m' + i);
      m.querySelector('.dot').textContent = on ? '✓' : '';
      m.querySelector('.t').textContent = on ? 'あなたの選択' : mine === null ? 'タップで選ぶ' : 'タップで変更';
      if (on && pop) { m.classList.remove('pop'); void m.offsetWidth; m.classList.add('pop'); }
    });
    buttons.classList.toggle('has-choice', mine !== null);
  }
  function fetchMine() {
    const sid = sessionId;
    if (!sid || !socket.connected) return;
    socket.timeout(5000).emit('mychoice', sid, (err, res) => {
      if (err || sid !== sessionId) return;
      mine = Number.isInteger(res?.choice) ? res.choice : null;
      showMine();
      render();
    });
  }

  // ---------- 効果音（Web Audio） ----------
  let ac = null;
  function tone(freq, start, dur, type = 'sine', vol = .25, slideTo) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, ac.currentTime + start);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, ac.currentTime + start + dur);
    g.gain.setValueAtTime(0.0001, ac.currentTime + start);
    g.gain.exponentialRampToValueAtTime(vol, ac.currentTime + start + .01);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + start + dur);
    o.connect(g).connect(ac.destination);
    o.start(ac.currentTime + start);
    o.stop(ac.currentTime + start + dur + .02);
  }
  function play(i) {
    if (!soundOn) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
      if (i === 0) { tone(880, 0, .12, 'triangle', .3); tone(1318.5, .07, .25, 'triangle', .3); tone(1760, .14, .3, 'sine', .15); }
      if (i === 1) { tone(587, 0, .16, 'triangle', .3, 784); }
      if (i === 2) { tone(330, 0, .2, 'square', .08, 196); }
    } catch (e) {}
  }

  // ---------- アニメーション ----------
  function animate(btn, i, x, y) {
    const r = btn.getBoundingClientRect();
    const px = x ?? r.width / 2, py = y ?? r.height / 2;
    btn.classList.add('press');
    setTimeout(() => btn.classList.remove('press'), 110);
    const size = Math.max(r.width, r.height) * 2;
    const rip = document.createElement('span');
    rip.className = 'ripple';
    Object.assign(rip.style, { width: size + 'px', height: size + 'px', left: px - size / 2 + 'px', top: py - size / 2 + 'px' });
    btn.appendChild(rip);
    setTimeout(() => rip.remove(), 600);
    const f = document.createElement('span');
    f.className = 'float';
    f.textContent = '✓';
    Object.assign(f.style, { left: px + 'px', top: py + 'px' });
    btn.appendChild(f);
    setTimeout(() => f.remove(), 850);
    const colors = [BV_CHOICES[i].color, '#ffd54a', '#3b2a20', '#fff'];
    for (let k = 0; k < 8; k++) {
      const p = document.createElement('span');
      p.className = 'particle';
      const ang = (Math.PI * 2 * k) / 8 + Math.random() * .5;
      const dist = 40 + Math.random() * 40;
      Object.assign(p.style, { left: px - 6 + 'px', top: py - 6 + 'px', background: colors[k % colors.length] });
      p.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
      p.style.setProperty('--dy', Math.sin(ang) * dist + 'px');
      p.style.setProperty('--r', Math.random() * 360 + 'deg');
      btn.appendChild(p);
      setTimeout(() => p.remove(), 650);
    }
  }

  // ---------- 状態表示 ----------
  function canVote() {
    return state && state.status === 'running' && state.session && state.session.state === 'open' && socket.connected;
  }
  function render() {
    const s = state;
    if (s?.name) { evName.textContent = s.name; document.title = s.name + '｜投票'; }
    const ok = canVote();
    btnEls.forEach((b) => (b.disabled = !ok));
    statusEl.className = 'status' + (ok ? ' open' : '');
    let big = '', small = '';
    if (!socket.connected) { big = '接続中…'; small = '電波の良い場所でお待ちください'; statusEl.textContent = '接続中'; }
    else if (!s || s.status === 'notfound' || s.status === 'deleted') { big = 'イベントが見つかりません'; small = 'URLをご確認ください'; statusEl.textContent = '—'; evName.textContent = 'ビブリオバトル投票'; }
    else if (s.status === 'draft') { big = 'まもなく始まります'; small = '投票が始まるとボタンが押せるようになります。このままお待ちください。'; statusEl.textContent = '開始前'; }
    else if (s.status === 'ended') { big = 'イベントは終了しました'; small = 'ご参加ありがとうございました！'; statusEl.textContent = '終了'; }
    else if (!ok) { big = '次の投票までお待ちください'; small = '投票が始まるとボタンが押せるようになります。'; statusEl.textContent = s.session ? `第${s.session.no}セッション・受付前` : '受付前'; }
    else statusEl.textContent = `第${s.session.no}セッション・投票受付中！`;
    hint.textContent = ok ? (mine === null ? 'どれか1つを選んでください' : '選び直せます（管理者が保存するまで）') : '';
    ovBig.textContent = big;
    ovSmall.textContent = small;
    overlay.classList.toggle('show', !ok);
  }

  function applyState(s) {
    const newId = s.session?.id || null;
    if (newId !== sessionId) {
      const had = mine !== null;
      sessionId = newId;
      mine = null;
      showMine();
      if (had) {
        const el = document.createElement('div');
        el.className = 'reset-flash';
        el.innerHTML = '投票がリセットされました<br><span style="font-size:13px;font-weight:700">次のセッションをお待ちください</span>';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 1700);
      }
      state = s;
      fetchMine();
    }
    state = s;
    render();
  }

  // ---------- 通信 ----------
  const socket = io({ transports: ['websocket', 'polling'] });
  socket.on('connect', () => { socket.emit('guest:join', { slug, voterId }); render(); fetchMine(); });
  socket.on('disconnect', render);
  socket.on('state', applyState);

  buttons.addEventListener('click', (e) => {
    const btn = e.target.closest('.vote');
    if (!btn || btn.disabled || !canVote()) return;
    const i = Number(btn.dataset.i);
    const r = btn.getBoundingClientRect();
    const x = e.clientX ? e.clientX - r.left : undefined;
    const y = e.clientY ? e.clientY - r.top : undefined;
    animate(btn, i, x, y);
    play(i);
    if (navigator.vibrate) navigator.vibrate(12);
    if (mine === i) return;
    const sid = sessionId, before = mine;
    mine = i;
    showMine(true);
    render();
    socket.timeout(5000).emit('vote', { sessionId: sid, choice: i }, (err, res) => {
      if (!err && res?.ok) return;
      if (sid === sessionId && mine === i) { mine = before; showMine(); render(); }
      if (res?.state) applyState(res.state);
      if (res?.limited) toast('ちょっと速すぎます！');
      else if (err) toast('送信できませんでした。もう一度タップしてください', 'error');
    });
  });

  soundBtn.onclick = () => {
    soundOn = !soundOn;
    soundBtn.textContent = soundOn ? '🔊' : '🔈';
    try { localStorage.setItem('bv:sound', soundOn ? 'on' : 'off'); } catch (e) {}
  };
  render();
</script>
</body>
</html>
