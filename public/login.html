<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ログイン｜ビブリオバトル投票</title>
<link rel="stylesheet" href="/style.css">
<style>
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .box { width: min(420px, 100%); }
  .hero { text-align: center; margin-bottom: 20px; }
  .hero .icons { display: flex; justify-content: center; gap: 8px; margin-bottom: 8px; }
  .hero .icons span { width: 56px; height: 56px; display: block; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: #eee3d3; padding: 4px; border-radius: 12px; margin-bottom: 18px; }
  .tabs button { border: 0; background: transparent; }
  .tabs button.on { background: var(--paper); box-shadow: var(--shadow); }
  .err { color: #b3261e; font-weight: 700; min-height: 1.6em; font-size: 14px; }
</style>
</head>
<body>
<div class="box">
  <div class="hero">
    <div class="icons" id="icons"></div>
    <h1>ビブリオバトル投票</h1>
    <p class="muted small">管理者ログイン</p>
  </div>
  <div class="card">
    <div class="tabs">
      <button id="tLogin" class="on" type="button">ログイン</button>
      <button id="tSignup" type="button">アカウント作成</button>
    </div>
    <form id="form">
      <label class="field">ユーザー名<input type="text" name="username" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" required></label>
      <label class="field">パスワード<input type="password" name="password" autocomplete="current-password" required></label>
      <label class="field" id="codeField" hidden>招待コード<input type="text" name="code" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"><span class="muted small" style="display:block;font-weight:400">Render の環境変数 <code>SIGNUP_CODE</code> に設定した文字です（大文字・小文字、全角・半角は区別しません）</span></label>
      <div class="err" id="err"></div>
      <button class="btn-primary btn-lg" style="width:100%" id="submit">ログイン</button>
    </form>
  </div>
</div>
<script src="/common.js"></script>
<script>
  document.getElementById('icons').innerHTML = BV_ICONS.map((s) => `<span>${s}</span>`).join('');
  let mode = 'login';
  let needCode = false;
  api('GET', '/api/config').then((c) => { needCode = c.signupCode; });
  const setMode = (m) => {
    mode = m;
    tLogin.classList.toggle('on', m === 'login');
    tSignup.classList.toggle('on', m === 'signup');
    submit.textContent = m === 'login' ? 'ログイン' : 'アカウントを作成';
    codeField.hidden = !(m === 'signup' && needCode);
    form.password.autocomplete = m === 'login' ? 'current-password' : 'new-password';
    err.textContent = '';
  };
  tLogin.onclick = () => setMode('login');
  tSignup.onclick = () => setMode('signup');
  form.onsubmit = async (e) => {
    e.preventDefault();
    err.textContent = '';
    const body = Object.fromEntries(new FormData(form));
    try {
      await api('POST', mode === 'login' ? '/api/login' : '/api/signup', body);
      location.href = '/room';
    } catch (ex) { err.textContent = ex.message; }
  };
</script>
</body>
</html>
